[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exportgeneanet"
version = "0.1.0"
description = "Export a public Geneanet tree to GEDCOM, respecting Geneanet's usage rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "protobuf>=5.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "grpcio-tools>=1.60",
    "ruff>=0.6",
]

[project.scripts]
exportgeneanet = "exportgeneanet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/exportgeneanet/proto"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["exportgeneanet"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires calling typer.Option()/typer.Argument() as argument
# defaults — that's the framework's intended pattern, not a bug.
"src/exportgeneanet/cli.py" = ["B008"]
